# docker-compose.override.yml — dev hot reload (auto-merged locally)
# Production mode: docker compose -f docker-compose.yml up

name: projectx

services:
  api:
    build:
      target: deps
    command: npx nest start --watch
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      ALLOW_SYNC: "false"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "9229:9229"
